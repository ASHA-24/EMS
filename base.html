{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Leave Management System{% endblock %}</title>
   <!--> <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">-->
    <!--<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">-->
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }

        html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            background-color:rgba(1, 7, 14, 0.88);
            height: 100%;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        .Header {
            background-color: rgb(29, 214, 60); 
            height: 80px;
            display: flex;
            align-items: center;   
            padding: 20px; 
            margin-bottom: 20px;    
            justify-content: center;
            position: relative;   
            
          
        }
        .image1{
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            height: 70px;
            width: auto;
            object-fit: contain;
        }

        .nav-link{
            color:white;
            font-size:20px;
            font-weight: bold;
            position: absolute;
            right: 20px; 
        }
        .navbar-brand{
            background-color:rgb(29, 214, 60);
            color: white;
            font-weight: 600;
        }

        .container{
            background-color:rgb(228, 236, 230);
            color: white;
            font-weight: 600;
        }
        .card {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border: 1px solid rgba(0, 0, 0, 0.125);
        }
        .card-header {
            background-color:rgb(29, 214, 60);
            color: white;
            font-weight: 600;
        }
        .btn-primary {
            background-color:rgb(29, 214, 60);
            border-color: rgb(29, 214, 60);
        }
        .btn-primary:hover {
            background-color:rgb(29, 214, 60);
            border-color: rgb(29, 214, 60);
        }
        .form-label {
            font-weight: 500;
            color: #495057;
        }
        .required {
            color: #dc3545;
        }
        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 600;
        }
        .form-control:focus {
            border-color: rgb(29, 214, 60);
            box-shadow: 0 0 0 0.2rem rgb(29, 214, 60);
        }
        .alert {
            border-radius: 0.5rem;
        }
        .card {
            border-radius: 0.75rem;
        }
        .btn {
            border-radius: 0.5rem;
            font-weight: 500;
        }
        .text-primary{
            color:black !important;
        }
    </style>
</head>
<body>
    <div class = "Header">
        <img class = "image1" src="{% static 'images/images.jpg' %}" alt ="AlphaData Logo"> 
        <a class="navbar-brand" href="{% url 'leave_request' %}">
            <i class="fas fa-calendar-alt me-2"></i>Alpha Data Leave Request
        </a>
        <a class="nav-link" href="{% url 'leave_request' %}">
            <i class="fas fa-plus me-1"></i>New Request
        </a>
    </div>

    

    <!--<div class="container mt-4 mb-5" style="background-color:rgba(1, 7, 14, 0.88);">-->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    <i class="fas fa-{% if message.tags == 'success' %}check-circle{% elif message.tags == 'error' %}exclamation-triangle{% else %}info-circle{% endif %} me-2"></i>
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    <!--</div>-->

    <!--<footer class="bg-light py-4 mt-5">
        <div class="container text-center">
            <p class="text-muted mb-0">
                <i class="fas fa-copyright me-1"></i>
                2025 Leave Management System. All rights reserved.
            </p>
        </div>
    </footer>-->

    <!--<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>-->
    <script>
        // Auto-dismiss alerts after 5 seconds
        setTimeout(function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            });
        }, 5000);
    </script>
</body>
</html>
